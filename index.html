<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A0709">
<title>Le jeu du Loup-Garou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Karla:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root{
    --noir:#0A0709; --carte:#150D10; --rouge:#9B141A; --rouge-vif:#C2262A;
    --rouge-sourd:#B8867F; --rouge-nuit:#3E080B; --blanc:#FFFFFF;
    --bord:rgba(155,20,26,.42);
    --ecran:Karla,"Helvetica Neue",Arial,sans-serif;
    --titre:Fraunces,Georgia,"Times New Roman",serif;
    --chiffre:"Space Mono",Menlo,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--noir);min-height:100%}
  body{color:var(--rouge-sourd);font-family:var(--ecran);
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:calc(20px + env(safe-area-inset-top,0px)) 150px;position:relative}
  #decor{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
  #decor svg{width:100%;height:100%;display:block}
  .wrap{position:relative;z-index:2;max-width:560px;margin:0 auto}
  h1,h2,h3{font-family:var(--titre);font-weight:900;margin:0;line-height:1.06;color:var(--rouge)}
  h1{font-size:2.1rem;letter-spacing:-.02em}
  h2{font-size:1.55rem}
  h3{font-size:1.05rem;font-weight:600}
  p{line-height:1.5;margin:.6em 0}
  .eyebrow{font-family:var(--chiffre);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--rouge);margin-bottom:12px;display:block}
  .doux{opacity:.78} .grand{font-size:1.1rem;line-height:1.45} .centre{text-align:center}
  .prenom{font-family:var(--titre);font-weight:900;color:var(--blanc);font-size:2.4rem;line-height:1.05;margin:4px 0 2px}
  .prenom-mid{font-family:var(--titre);font-weight:900;color:var(--blanc);font-size:1.45rem;line-height:1.3}
  .code{font-family:var(--chiffre);font-size:3rem;font-weight:700;color:var(--blanc);
    letter-spacing:.3em;text-align:center;margin:10px 0 4px}
  .carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:18px;margin:14px 0}
  button{font-family:var(--ecran);font-size:1rem;font-weight:600;border-radius:11px;border:1px solid var(--bord);
    background:var(--carte);color:var(--rouge-sourd);padding:15px 16px;width:100%;cursor:pointer;
    transition:transform .12s ease,opacity .2s ease}
  button:active{transform:scale(.975)}
  button:focus-visible{outline:2px solid var(--rouge-vif);outline-offset:2px}
  button[disabled]{opacity:.35;cursor:default}
  .primaire{background:var(--rouge);color:#fff;border-color:transparent;font-weight:800}
  .danger{background:var(--rouge-nuit);color:#fff;border-color:var(--rouge);font-weight:800}
  .liste{display:grid;gap:9px;margin:16px 0}
  .nom{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
  .nom b{flex:1;min-width:0;color:var(--blanc);font-weight:800;font-size:1.02rem}
  .tag{font-family:var(--chiffre);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--rouge);white-space:nowrap}
  .tag.ok{color:var(--rouge-sourd);opacity:.55} .tag.mort{color:var(--rouge-vif)}
  input[type=text]{width:100%;padding:14px;font-size:1.05rem;font-family:var(--ecran);font-weight:600;
    background:var(--carte);color:var(--blanc);border:1px solid var(--bord);border-radius:11px}
  input.codeinput{font-family:var(--chiffre);font-size:1.8rem;letter-spacing:.4em;text-align:center;text-transform:uppercase}
  input::placeholder{color:var(--rouge-sourd);opacity:.4;font-weight:400;letter-spacing:normal}
  .role-carte{border:1px solid var(--bord);border-radius:16px;padding:20px;text-align:center;
    background:var(--carte);margin:16px 0;animation:apparait .45s ease}
  .role-img{width:130px;height:130px;max-width:100%;border-radius:12px;object-fit:cover;
    border:1px solid var(--bord);display:block;margin:0 auto 14px}
  .role-nom{font-family:var(--titre);font-size:1.95rem;font-weight:900;color:var(--rouge);margin:0 0 8px}
  .equipe{font-family:var(--chiffre);font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
  @keyframes apparait{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .embleme{width:78px;margin:0 auto 16px;color:var(--rouge);display:block}
  .embleme svg{width:100%;height:auto;display:block}
  .embleme.petit{width:52px;margin-bottom:12px}
  .ico{width:22px;height:22px;flex:none;color:var(--rouge)}
  .ico svg{width:100%;height:100%;display:block}
  .chrono{font-family:var(--chiffre);font-size:3.6rem;font-weight:700;text-align:center;
    color:var(--blanc);margin:18px 0 6px;font-variant-numeric:tabular-nums}
  .chrono.urgent{color:var(--rouge-vif)}
  .barres{display:grid;gap:11px;margin:18px 0}
  .barre-nom{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .barre-nom b{color:var(--blanc);font-size:1rem;font-weight:800}
  .barre-fond{height:9px;background:rgba(155,20,26,.28);border-radius:5px;overflow:hidden}
  .barre-fond span{display:block;height:100%;background:var(--rouge);transition:width .5s ease}
  .avis{border-left:3px solid var(--rouge);padding:3px 0 3px 13px;margin:16px 0;font-size:.92rem}
  hr{border:0;border-top:1px solid var(--bord);margin:22px 0}
  .compo-ligne{display:flex;align-items:center;gap:11px;background:var(--carte);
    border:1px solid var(--bord);border-radius:13px;padding:10px 12px;margin-bottom:9px}
  .compo-vignette{width:46px;height:46px;border-radius:10px;overflow:hidden;flex:none;border:1px solid var(--bord)}
  .compo-vignette img{width:100%;height:100%;object-fit:cover;display:block}
  .compo-txt{flex:1;min-width:0}
  .compo-txt b{color:var(--blanc);font-size:.98rem;font-weight:800;display:block}
  .compo-txt span{font-size:.7rem;opacity:.72}
  .compteur{display:flex;align-items:center;gap:7px;flex:none}
  .compteur button{width:38px;height:38px;padding:0;font-size:1.2rem;font-family:var(--chiffre);border-radius:9px}
  .compteur .val{font-family:var(--chiffre);font-size:1.1rem;font-weight:700;color:var(--blanc);min-width:20px;text-align:center}
  .bilan{border:1px dashed var(--bord);border-radius:12px;padding:13px;text-align:center;margin:14px 0}
  .bilan b{color:var(--blanc);font-size:1.1rem}
  .attente{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 0;
    font-family:var(--chiffre);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rouge)}
  .braise{width:9px;height:9px;border-radius:50%;background:var(--rouge);animation:battre 1.8s ease-in-out infinite}
  @keyframes battre{0%,100%{opacity:.25}50%{opacity:1}}
  #profils{position:fixed;left:0;right:0;bottom:0;z-index:5;flex-wrap:wrap;
    background:linear-gradient(to top,var(--noir) 62%,rgba(10,7,9,.92));border-top:1px solid var(--bord);
    padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));
    padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:none;justify-content:center;gap:6px}
  .profil{flex:1;max-width:104px;text-align:center}
  .rond{position:relative;width:72px;max-width:100%;aspect-ratio:1;margin:0 auto 7px;border-radius:50%;
    border:2px solid var(--bord);overflow:hidden;background:var(--carte);display:flex;align-items:center;justify-content:center}
  .rond img{width:100%;height:100%;object-fit:cover;filter:grayscale(.18) brightness(.95)}
  .rond svg{width:40px;height:40px;fill:var(--rouge);opacity:.75}
  .profil.mort .rond{border-color:var(--rouge-vif)}
  .profil.mort .rond::before,.profil.mort .rond::after{content:"";position:absolute;left:50%;top:50%;
    width:150%;height:3.5px;background:var(--rouge-vif)}
  .profil.mort .rond::before{transform:translate(-50%,-50%) rotate(45deg)}
  .profil.mort .rond::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .p-nom{font-size:.84rem;font-weight:800;color:var(--blanc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-role{font-family:var(--chiffre);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--rouge)}
  .profil.mort .p-nom{opacity:.5;text-decoration:line-through;color:var(--rouge-sourd)}
  #son{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));
    z-index:9;width:44px;height:44px;padding:0;border-radius:50%;display:none;align-items:center;justify-content:center;
    background:var(--carte);border:1px solid var(--bord);color:var(--rouge)}
  #son svg{width:22px;height:22px} #son.muet{opacity:.45}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="decor"></div>
<div class="wrap"><div id="app"></div></div>
<div id="profils"></div>
<button id="son" aria-label="Voix du narrateur"></button>

const R = p => db.ref("salons/"+CODE+(p?"/"+p:""));
const estTable = () => MODE==="table";
const ordre = () => (ETAT&&ETAT.ordre)||[];
const estVivant = u => !!(ETAT&&ETAT.vivants&&ETAT.vivants[u]);
const vivants = () => ordre().filter(estVivant);
const nomDe = u => (JOUEURS[u]&&JOUEURS[u].nom)||"?";
const jeton = () => (ETAT?ETAT.nuit:0)+"-"+(ETAT?ETAT.phase:"");
const aAgi = u => ACTIONS[u] && ACTIONS[u].j===jeton();
const toutesActions = () => vivants().length>0 && vivants().every(u=>aAgi(u));
const tourVote = () => (ETAT?ETAT.nuit:0)+"-"+(ETAT&&ETAT.revote?"2":"1");
const aVote = u => VOTES[u] && VOTES[u].t===tourVote();
const monRole = () => MONROLE && MONROLE.role;

/* ---------- narration ---------- */
function narrer(texte,cle){
  if(!estTable()||!VOIX||!texte) return;
  if(cle){ if(cle===derniereCle) return; derniereCle=cle; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(texte);
    u.lang="fr-FR"; u.rate=.86; u.pitch=.6;
    const v=speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang))[0];
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
const taire=()=>{ try{speechSynthesis.cancel();}catch(e){} };

    +'<span class="equipe">'+(Rr.equipe==="loup"?"Camp du Loup":"Camp du village")+'</span>'

function barre(){
  const bar=$("#profils");
  const montrer=estTable()&&ordre().length&&ETAT&&!["salon","compo"].includes(ETAT.phase);
  bar.style.display=montrer?"flex":"none";
  if(!montrer){ document.body.style.paddingBottom="60px"; return; }
  const rev=(ETAT&&ETAT.revele)||{};
  bar.innerHTML=ordre().map(u=>{
    const mort=!estVivant(u), r=rev[u];
    return '<div class="profil '+(mort?"mort":"")+'"><div class="rond">'
      +(mort&&r?'<img src="'+IMG[r]+'" alt="">':CAPUCHE)+'</div>'
      +'<div class="p-nom">'+esc(nomDe(u))+'</div>'
      +'<div class="p-role">'+(mort&&r?esc(ROLES[r].nom):"&nbsp;")+'</div></div>';
  }).join("");
  requestAnimationFrame(()=>{ document.body.style.paddingBottom=(bar.offsetHeight+22)+"px"; });
}
function majSon(){
  const b=$("#son");
  b.style.display=estTable()?"flex":"none";
  b.classList.toggle("muet",!VOIX);
  b.innerHTML=VOIX?S.hp:S.hpMuet;
}

/* ---------- rendu ---------- */
let MSG=null;
function signaler(e,quoi){
  const c=(e&&e.code)?e.code:(e&&e.message)?e.message:e;
  MSG="Impossible de "+quoi+" ("+c+"). Si ça se répète, recharge la page.";
  rendre();
  setTimeout(()=>{ MSG=null; rendre(); },6000);
}
function rendre(){
  const act=document.activeElement;
  const sauve=(act&&act.id&&act.tagName==="INPUT")?{id:act.id,v:act.value,s:act.selectionStart}:null;
  let html;
  if(ERREUR) html=vErreur();
  else if(!PRET) html=vChargement();
  else if(!MODE||!CODE) html=vAccueil();
  else if(estTable()){
    html=vTable();
    if(ETAT&&!["salon","compo","fin"].includes(ETAT.phase)) html+=piedTable();
  }
  else html=vJoueur();
  $("#app").innerHTML=(MSG?'<div class="avis">'+esc(MSG)+'</div>':'')+html;
  if(sauve){
    const el=$("#"+sauve.id);
    if(el){ el.value=sauve.v; try{ el.focus(); el.setSelectionRange(sauve.s,sauve.s); }catch(e){} }
  }
  brancher(); barre(); majSon();
  if(estTable()) narrerPhase();
  calerChrono();
}
const vChargement=()=>'<span class="eyebrow">Le jeu du Loup-Garou</span><h1>On réveille le village…</h1>'+patience("connexion");
const vErreur=()=>'<span class="eyebrow">Le jeu du Loup-Garou</span><h1>Ça coince</h1>'
  +'<div class="carte"><p class="grand">'+esc(ERREUR)+'</p></div>'
  +'<div class="liste"><button id="reessayer">Recharger</button><button id="oublier">Quitter ce salon</button></div>';

function vAccueil(){
  return emb(S.table)+'<span class="eyebrow">Le jeu du Loup-Garou</span><h1>Un village,<br>plusieurs téléphones</h1>'
    +'<p class="doux grand">Un appareil tient la table : il reste au centre, il annonce et il parle. Chacun des autres garde ses secrets sur le sien.</p>'
    +'<div class="liste"><button class="primaire" id="creer">Ouvrir une table</button></div>'
    +'<hr><h3>Rejoindre une table</h3>'

/* ===== TABLE ===== */
function vTable(){
  const p=ETAT?ETAT.phase:null;
  if(!ETAT||p==="salon") return vSalonTable();
  if(p==="compo") return vCompo();
  if(p==="distribution") return vDistribTable();
  if(p==="nuit") return vNuitTable();
  if(p==="matin") return vMatinTable();
  if(p==="chasseur") return vChasseurTable();
  if(p==="tir") return vTirTable();
  if(p==="ultime") return vUltimeTable();
  if(p==="debat") return vDebatTable();
  if(p==="vote") return vVoteTable();
  if(p==="resultat") return vResultatTable();
  if(p==="fin") return vFinTable();
  return vSalonTable();
}
function vSalonTable(){
  const l=Object.keys(JOUEURS), n=l.length;
  return '<span class="eyebrow">Table · en préparation</span><h2>Code de la table</h2>'
    +'<div class="code">'+esc(CODE)+'</div>'
    +'<p class="doux centre">Chacun ouvre la page sur son téléphone et tape ce code.</p>'
    +'<div class="carte"><h3>À table</h3>'
    +(n?'<div class="prenom-mid">'+l.map(u=>esc(nomDe(u))).join("  ·  ")+'</div>'
       :'<p class="doux">Personne encore.</p>')
    +'<p class="doux tag" style="margin-bottom:0">'+n+' joueur'+(n>1?"s":"")+' · minimum 5, maximum 12</p></div>'
    +'<div class="liste"><button class="primaire" id="vers-compo" '+((n<5||n>12)?"disabled":"")+'>Choisir les rôles</button>'
    +'<button id="vider">Vider la table</button></div>'
    +'<p class="doux tag centre">'+esc(VERSION)+'</p>';
}
function vCompo(){
  const n=Object.keys(JOUEURS).length, besoin=n;
  const c=brouillonCompo||(brouillonCompo=defautCompo(n));
  // les villageois comblent toujours le reste : la composition est valide en permanence
  const autres=ORDRE.filter(r=>r!=="villageois").reduce((s,r)=>s+(c[r]||0),0);
  c.villageois=Math.max(0,besoin-autres);
  const place=c.villageois>0;
  const ligne=(r,min,max)=>{
    const v=c[r]||0;
    const note=r==="loup"?"1 à 3 · au moins un est toujours en jeu"
      :r==="villageois"?"comble automatiquement le reste":"présent ou absent";
    const cmd=r==="villageois"
      ? '<div class="compteur"><span class="val">'+v+'</span></div>'
      : '<div class="compteur"><button data-moins="'+r+'" '+(v<=min?"disabled":"")+'>−</button>'
        +'<span class="val">'+v+'</span>'
        +'<button data-plus="'+r+'" '+((max!==null&&v>=max)||!place?"disabled":"")+'>+</button></div>';
    return '<div class="compo-ligne"><div class="compo-vignette"><img src="'+IMG[r]+'" alt=""></div>'
      +'<div class="compo-txt"><b>'+esc(ROLES[r].nom)+(r==="loup"&&v>1?"s":"")+'</b>'
      +'<span>'+note+'</span></div>'+cmd+'</div>';
  };
  return '<span class="eyebrow">Table · composition</span><h2>Quels rôles en jeu ?</h2>'
    +'<p class="doux">Une carte par joueur : il faut <b style="color:var(--blanc)">'+besoin+' cartes</b>. '
    +'Retire un rôle et un villageois prend sa place ; ajoute-en un et un villageois s\'efface.</p>'
    +ligne("loup",1,3)+UNIQUES.map(r=>ligne(r,0,1)).join("")+ligne("villageois",0,null)
    +(place?'':'<div class="avis">Plus de villageois disponible : retire un rôle pour en ajouter un autre.</div>')
    +'<div class="liste"><button class="primaire" id="distribuer">Distribuer les rôles</button>'
    +'<button id="retour-salon">Revenir</button></div>';
}

function vDistribTable(){
  const n=ordre().length, vus=ordre().filter(aAgi).length;
  return '<span class="eyebrow">Table · remise des rôles</span><h2>Chacun regarde sa carte</h2>'
    +'<div class="carte"><div class="prenom-mid">'+vus+' sur '+n+'</div><p class="doux" style="margin-bottom:0">ont vu leur rôle.</p></div>'
    +'<div class="liste"><button class="primaire" id="vers-nuit" '+(vus<n?"disabled":"")+'>Éteindre les lumières</button></div>'
    +(vus<n?patience("en attente des derniers")+secours("forcer-nuit","Éteindre quand même"):"");
}
function vNuitTable(){
  return emb(S.lune)+'<span class="eyebrow">Table · nuit '+ETAT.nuit+'</span><h2>Le village dort</h2>'
    +'<p class="doux grand">Personne ne parle. Ceux qui ont un pouvoir agissent sur leur téléphone.</p>'
    +(toutesActions()?'<div class="liste"><button class="primaire" id="lever-jour">Lever le jour</button></div>'
                     :patience("la nuit suit son cours")+secours("forcer-jour","Lever le jour quand même"));
}
function annonceMatin(){
  const v=ETAT.victime;
  if(ETAT.sauvee) return '<h2>Personne n\'est mort cette nuit</h2><div class="prenom">'+esc(nomDe(v))+'</div>'

    +'<p class="doux">n\'a pas vu l\'aube. Sa carte :</p>'+carteRole((ETAT.revele||{})[v],"Sa carte");

const vMatinTable=()=>emb(S.soleil)+'<span class="eyebrow">Table · jour '+ETAT.nuit+'</span>'+annonceMatin()
  +'<div class="liste"><button class="primaire" id="apres-matin">Continuer</button></div>';
const vChasseurTable=()=>emb(S.main)+'<span class="eyebrow">Table · dernier souffle</span><h2>Le Chasseur lève son fusil</h2>'
  +'<div class="prenom">'+esc(nomDe(ETAT.chasseurUid))+'</div>'
  +'<p class="grand doux">Il choisit sur son téléphone qui il emporte.</p>'+patience("il met en joue")+secours("forcer-chasseur","Il ne tire pas");
const vTirTable=()=>emb(S.main)+'<span class="eyebrow">Table · le coup part</span><h2>Abattu par le Chasseur</h2>'
  +'<div class="prenom">'+esc(nomDe(ETAT.tire))+'</div>'+carteRole((ETAT.revele||{})[ETAT.tire],"Sa carte")
  +'<div class="liste"><button class="primaire" id="apres-tir">Continuer</button></div>';
function vUltimeTable(){

function texteChrono(){
  const r=Math.max(0,Math.ceil(((ETAT&&ETAT.chronoFin||0)-Date.now())/1000));
  return Math.floor(r/60)+":"+String(r%60).padStart(2,"0");
}
function vDebatTable(){
  const tete=ETAT.revote
    ?'<span class="eyebrow">Table · départage</span><h2>Deux noms sur la sellette</h2>'
      +'<div class="prenom-mid" style="margin:10px 0">'+(ETAT.exaequo||[]).map(u=>esc(nomDe(u))).join("  ·  ")+'</div>'
    :'<span class="eyebrow">Table · jour '+ETAT.nuit+'</span><h2>À vous de parler</h2>';
  return emb(S.sablier,1)+tete+'<div class="chrono" id="chrono">'+texteChrono()+'</div>'
    +'<div class="liste"><button class="primaire" id="aller-vote">'+(ETAT.revote?"Passer au second vote":"Passer au vote")+'</button></div>';

function vVoteTable(){

    +'<div class="liste"><button class="primaire" id="depouiller" '+(v<n?"disabled":"")+'>Ouvrir l\'urne</button></div>'
    +(v<n?patience("en attente de bulletins")+secours("forcer-urne","Dépouiller quand même"):"");
}
function vResultatTable(){
  const r=ETAT.resultat||{}, compte=r.compte||[];
  const total=compte.reduce((s,c)=>s+c.n,0)||1;
  const barres=compte.map(c=>'<div><div class="barre-nom"><b>'+esc(nomDe(c.uid))+'</b><span class="tag">'+c.n+' voix</span></div>'
    +'<div class="barre-fond"><span style="width:'+((c.n/total)*100)+'%"></span></div></div>').join("");

function vFinTable(){

  const gagnants=ordre().filter(u=>rev[u]&&(ROLES[rev[u]].equipe==="village")===village);

  return '<span class="eyebrow">Table · fin de partie</span>'
    +'<h1>'+(village?"Le village a eu leur peau.":(nbL>1?"Les Loups ont dévoré le village.":"Le Loup a dévoré le village."))+'</h1>'
    +'<div class="carte"><h3>'+(village?"Camp du village":"Camp du Loup")+'</h3>'
    +'<div class="prenom-mid">'+gagnants.map(u=>esc(nomDe(u))).join("  ·  ")+'</div></div>'
    +'<hr><span class="eyebrow">Toutes les cartes</span><div class="liste">'
    +ordre().map(u=>'<div class="nom carte" style="margin:0"><b>'+esc(nomDe(u))+'</b><span class="tag">'+esc(rev[u]?ROLES[rev[u]].nom:"?")+'</span></div>').join("")+'</div>'
    +'<div class="liste"><button class="primaire" id="rejouer">Nouvelle partie</button></div>';

/* ===== JOUEUR ===== */
function vJoueur(){
  const p=ETAT?ETAT.phase:null, inscrit=!!JOUEURS[ME];
  if(!ETAT||p==="salon"||p==="compo"){
    if(!inscrit) return vSasseoir();
    return '<span class="eyebrow">Table '+esc(CODE)+'</span><h2>'+esc(nomDe(ME))+', assis</h2>'
      +'<p class="doux grand">Regarde le téléphone au centre. La partie commence quand l\'organisateur distribue les rôles.</p>'
      +'<div class="carte"><h3>Autour de la table</h3><div class="prenom-mid">'
      +Object.keys(JOUEURS).map(u=>esc(nomDe(u))).join("  ·  ")+'</div></div>'
      +'<div class="liste"><button id="quitter-siege">Ce n\'est pas mon prénom</button></div>';
  }
  if(ordre().indexOf(ME)<0) return '<span class="eyebrow">Spectateur</span><h2>Tu n\'es pas dans cette partie</h2>'
    +'<p class="doux grand">Elle a commencé sans toi. Regarde la table, et assieds-toi à la prochaine.</p>';
  if(!monRole()) return patience("réception de ta carte");
  if(p==="distribution") return vMaCarte();
  if(p==="nuit") return vMaNuit();
  if(p==="chasseur") return vMonTir();
  if(p==="vote") return vMonBulletin();
  if(p==="debat") return vMonDebat();
  if(p==="fin") return vFinJoueur();
  return vSuivreTable();
}
function vSasseoir(){
  return '<span class="eyebrow">Table '+esc(CODE)+'</span><h1>Prends place</h1>'
    +'<p class="doux grand">Écris ton prénom. Il apparaîtra sur le téléphone de la table.</p>'
    +'<input type="text" id="mon-nom" placeholder="Ton prénom" autocomplete="off" maxlength="18">'
    +'<div class="liste"><button class="primaire" id="s-asseoir">M\'asseoir</button>'
    +'<button id="oublier">Changer de table</button></div>'
    +'<div id="err" class="avis" style="display:none">Choisis un prénom que personne n\'a déjà pris.</div>';
}
function vMaCarte(){
  if(aAgi(ME)) return '<span class="eyebrow">Ta carte est connue</span><h2>Garde-la pour toi</h2>'
    +'<p class="grand doux">Range ton téléphone et regarde la table.</p>'+patience("en attente des autres");
  return '<span class="eyebrow">Ton rôle</span><div class="prenom">'+esc(nomDe(ME))+'</div>'
    +carteRoleDesc(monRole())
    +(MONROLE.meute?'<div class="carte"><span class="equipe">Ta meute</span><div class="prenom-mid">'
      +MONROLE.meute.map(u=>esc(nomDe(u))).join("  ·  ")+'</div></div>':'')
    +'<div class="avis">Personne d\'autre ne doit voir cet écran.</div>'
    +'<div class="liste"><button class="primaire" id="carte-vue">J\'ai vu ma carte</button></div>';
}
function vMaNuit(){
  if(!estVivant(ME)) return emb(S.lune)+'<span class="eyebrow">Nuit '+ETAT.nuit+'</span><h2>Tu es mort</h2>'
    +'<p class="grand doux">Tu ne joues plus, mais tu peux regarder. Ne dis rien.</p>';
  const r=monRole(), rev=MONROLE.revelation;
  if(rev&&!vuePanneau.revVue) return panRevelation(rev);
  if(r==="loup") return panLoup();
  if(r==="sorciere") return panSorciere();
  if(r==="voyante") return panVoyante();
  if(r==="sbire"&&ETAT.nuit===1&&!aAgi(ME)) return panSbire();
  if(!aAgi(ME)) marquerAction();
  return emb(S.lune)+'<span class="eyebrow">Nuit '+ETAT.nuit+'</span><h2>Tu dors</h2>'
    +'<p class="grand doux">Rien à faire cette nuit. La table te réveillera.</p>';
}
function panRevelation(rev){
  return emb(S.oeil)+'<span class="eyebrow">Tu perces son masque</span><h2>Son vrai rôle</h2>'
    +'<div class="prenom">'+esc(rev.nom)+'</div>'+carteRole(rev.role,"Sa carte")
    +'<p class="doux centre">Ton don est épuisé. Il te reste ta mémoire et ton jugement.</p>'
    +'<div class="liste"><button class="primaire" id="fin-action">C\'est noté</button></div>';
}
function panLoup(){
  const vue=MONROLE.vue||{}, freres=(MONROLE.meute||[]).filter(u=>u!==ME&&estVivant(u));
  const bande=freres.length?'<div class="carte"><span class="equipe">Ta meute</span><div class="prenom-mid">'
    +freres.map(u=>esc(nomDe(u))).join("  ·  ")+'</div><p class="doux" style="margin:8px 0 0">Le dernier choix enregistré est celui qui compte.</p></div>':"";

    +'<div class="liste"><button id="changer-proie">Changer de proie</button></div>';

    +(vue.cible?'<div class="avis">Ta meute a déjà désigné '+esc(nomDe(vue.cible))+'. Touche un autre nom pour changer.</div>':'')
    +'<div class="liste">'+vivants().filter(u=>(MONROLE.meute||[]).indexOf(u)<0).map(u=>
      '<button class="nom danger" data-proie="'+esc(u)+'"><b>'+esc(nomDe(u))+'</b><span class="tag">'+(vue.cible===u?"choisie":"dévorer")+'</span></button>').join("")+'</div>';

function panSorciere(){
  const vue=MONROLE.vue||{};
  if(aAgi(ME)) return emb(S.lune)+'<span class="eyebrow">C\'est fait</span><h2>'+(vue.versee?"Fiole versée":"Tu la laisses partir")+'</h2>'
    +'<p class="grand doux">'+(vue.versee?"Ta fiole est vide pour le reste de la partie.":"Tu gardes ta fiole pour une autre nuit.")+'</p>';

    return emb(S.lune)+'<span class="eyebrow">Sorcière</span><h2>La meute a choisi</h2>'

  return emb(S.lune)+'<span class="eyebrow">Sorcière</span><h2>La meute a choisi</h2>'
    +'<div class="prenom">'+esc(nomDe(vue.cible))+'</div><p class="doux">Une seule résurrection pour toute la partie.</p>'
    +'<div class="liste"><button class="primaire" data-fiole="1">Verser la fiole</button><button data-fiole="0">Laisser mourir</button></div>';

function panVoyante(){
  const vue=MONROLE.vue||{}, peutSonder=vue.sondage!==false;

    return emb(S.oeil)+'<span class="eyebrow">Voyante</span><h2>Ton don est épuisé</h2>'

const vMonDebat=()=>emb(S.sablier,1)+'<span class="eyebrow">'+(ETAT.revote?"Départage":"Débat")+'</span><h2>Parlez-vous</h2>'

  return '<span class="eyebrow">Fin de partie</span><h1>'+(gagne?"Tu l\'emportes.":"Tu as perdu.")+'</h1>'

function vSuivreTable(){
  const p=ETAT.phase, rev=ETAT.revele||{};
  let t="Regarde la table", s="Le téléphone du centre mène la partie.";
  if(p==="matin"){ t=ETAT.sauvee?"Personne n'est mort":"La meute a frappé";
    s=ETAT.victime?(ETAT.sauvee?nomDe(ETAT.victime)+" a été ranimé par la Sorcière.":nomDe(ETAT.victime)+" n'a pas vu l'aube. Sa carte : "+(rev[ETAT.victime]?ROLES[rev[ETAT.victime]].nom:"?")+"."):""; }
  else if(p==="tir"){ t="Le Chasseur a tiré"; s=nomDe(ETAT.tire)+" tombe. Sa carte : "+(rev[ETAT.tire]?ROLES[rev[ETAT.tire]].nom:"?")+"."; }
  else if(p==="chasseur"){ t="Le Chasseur met en joue"; s="Il choisit sur son propre téléphone."; }
  else if(p==="resultat"){ const r=ETAT.resultat||{};
    if(r.egalite){ t="Égalité"; s=r.definitif?"Personne ne meurt aujourd'hui.":"Le village n'a pas tranché."; }
    else { t="Le village a tranché"; s=nomDe(r.elu)+" est éliminé. Sa carte : "+(rev[r.elu]?ROLES[rev[r.elu]].nom:"?")+"."; } }
  else if(p==="ultime"){ t="Dernier jour"; s="Le village ne se rendort pas. Ce vote décide de tout."; }
  else if(p==="vote"){ t="L'urne passe"; s="Attends ton tour, ou regarde la table."; }
  return '<span class="eyebrow">'+(estVivant(ME)?"Tu es en vie":"Tu es mort")+'</span><h2>'+esc(t)+'</h2>'
    +'<p class="grand doux">'+esc(s)+'</p>';
}

/* ---------- narration par phase ---------- */
function narrerPhase(){
  if(!ETAT) return;
  const p=ETAT.phase, rev=ETAT.revele||{};
  if(p==="distribution") return narrer("Les rôles sont distribués. Que chacun découvre sa carte sur son téléphone, sans la montrer.","dist");
  if(p==="nuit") return narrer("La nuit tombe sur le village. Fermez les yeux. Ceux qui ont un pouvoir agissent en silence.","nuit"+ETAT.nuit);
  if(p==="matin"&&!ETAT.victime) return narrer("Le jour se lève. Étrangement, personne n'a été touché cette nuit.","matin"+ETAT.nuit);
  if(p==="matin") return narrer(ETAT.sauvee
    ?"Le jour se lève. Cette nuit, "+nomDe(ETAT.victime)+" a été désigné. Mais la Sorcière a versé sa fiole et l'a ramené parmi vous. Personne n'est mort."
    :"Le jour se lève. "+nomDe(ETAT.victime)+" n'a pas vu l'aube. Sa carte était "+(rev[ETAT.victime]?ROLES[rev[ETAT.victime]].nom:"inconnue")+".","matin"+ETAT.nuit);
  if(p==="chasseur") return narrer(nomDe(ETAT.chasseurUid)+" s'effondre. Mais sa main trouve son fusil. Il ne partira pas seul.","chas"+ETAT.nuit);
  if(p==="tir") return narrer("Le coup part. "+nomDe(ETAT.tire)+" tombe. Sa carte était "+(rev[ETAT.tire]?ROLES[rev[ETAT.tire]].nom:"inconnue")+".","tir"+ETAT.nuit+ETAT.tire);
  if(p==="ultime") return narrer("Le village ne se rendort pas. Vous n'êtes plus que "+vivants().length+". Ce vote est votre dernière chance.","ult"+ETAT.nuit);
  if(p==="debat") return narrer(ETAT.revote?"Départage. Cinq minutes pour choisir entre eux deux.":"Le débat est ouvert. Cinq minutes. Regardez-vous bien.","deb"+tourVote());
  if(p==="vote") return narrer("L'urne passe. Que chacun glisse son bulletin, en silence.","vot"+tourVote());
  if(p==="resultat"){ const r=ETAT.resultat||{};
    if(r.egalite) return narrer(r.definitif?"Égalité, une seconde fois. Personne ne mourra aujourd'hui.":"Égalité. Le village n'a pas tranché.","res"+tourVote());
    return narrer("Le village a tranché. "+nomDe(r.elu)+" est éliminé. Sa carte était "+(rev[r.elu]?ROLES[rev[r.elu]].nom:"inconnue")+".","res"+tourVote()+r.elu); }
  if(p==="fin") return narrer(ETAT.fin==="village"?"Le village a eu leur peau. La nuit est terminée.":"Les loups ont dévoré le village. Plus personne ne se réveillera.","fin");
}
function calerChrono(){
  clearInterval(chronoTimer); chronoTimer=null;
  if(!ETAT||ETAT.phase!=="debat") return;
  chronoTimer=setInterval(()=>{
    const el=$("#chrono"); if(!el){ clearInterval(chronoTimer); return; }
    el.textContent=texteChrono();
    el.classList.toggle("urgent",((ETAT.chronoFin||0)-Date.now())/1000<=30);
  },1000);
}

/* ---------- composition ---------- */
function defautCompo(n){
  // on garde toujours deux villageois de réserve, pour pouvoir ajouter un rôle sans rien retirer
  const c={loup:1,villageois:0,chasseur:0,sorciere:0,sbire:0,voyante:0};
  c.loup = n<=7 ? 1 : n<=10 ? 2 : 3;
  let place = n - c.loup - 2;
  for(const r of ["voyante","sorciere","chasseur","sbire"]){
    if(place>0){ c[r]=1; place--; }
  }
  const autres=ORDRE.filter(r=>r!=="villageois").reduce((s,r)=>s+c[r],0);
  c.villageois=Math.max(0,n-autres);
  return c;
}
const totalCompo=c=>ORDRE.reduce((s,r)=>s+(c[r]||0),0);

/* ---------- arbitrage (table) ---------- */
async function viderNoeud(nom){
  try{ await R(nom).remove(); return; }catch(e){}
  try{
    const s = await R(nom).once("value");
    const v = s.val(); if(!v) return;
    for(const k of Object.keys(v)){ try{ await R(nom+"/"+k).remove(); }catch(e){} }
  }catch(e){}
}

async function distribuerRoles(){
 try{
  const uids=Object.keys(JOUEURS);
  const besoin=uids.length;
  const autres=ORDRE.filter(r=>r!=="villageois").reduce((s,r)=>s+(brouillonCompo[r]||0),0);
  brouillonCompo.villageois=Math.max(0,besoin-autres);
  const paquet=[];
  ORDRE.forEach(r=>{ for(let k=0;k<(brouillonCompo[r]||0);k++) paquet.push(r); });
  paquet.splice(paquet.indexOf("loup"),1);
  melange(paquet);
  const n=uids.length;
  const roles=melange(["loup"].concat(paquet.slice(0,n-1)));
  // plus de cartes au centre : autant de rôles que de joueurs
  const ord=melange(uids.slice());
  const attrib={}; ord.forEach((u,i)=>attrib[u]=roles[i]);
  const meute=ord.filter(u=>attrib[u]==="loup");
  const vivantsMap={}; ord.forEach(u=>vivantsMap[u]=true);

  const majRoles={};
  ord.forEach(u=>{
    const o={role:attrib[u]};
    if(attrib[u]==="loup"||attrib[u]==="sbire") o.meute=meute;
    if(attrib[u]==="voyante") o.vue={sondage:true};
    if(attrib[u]==="sorciere") o.vue={potion:true};
    if(attrib[u]==="loup") o.vue={cible:null};
    majRoles[u]=o;
  });
  await viderNoeud("actions");
  await viderNoeud("votes");
  await viderNoeud("demandes");
  await R("roles").set(majRoles);
  await R("prive").set({potion:true,sondage:true,cible:null,sauvee:false});
  await R("etat").set({phase:"distribution",nuit:1,ordre:ord,vivants:vivantsMap,revele:{},
    compo:brouillonCompo,victime:null,sauvee:false,tire:null,chasseurUid:null,suite:null,
    revote:false,exaequo:[],resultat:null,fin:null,chronoFin:0});
 }catch(e){
   ERREUR="La distribution a échoué ("+(e&&e.code?e.code:e)+"). Vérifie que les règles de sécurité sont bien publiées dans Firebase.";
   rendre();
 }
}

async function traiterDemandes(){
  if(!estTable()||enTraitement) return;
  const liste=Object.keys(DEMANDES||{});
  if(!liste.length) return;
  enTraitement=true;
  try{
    for(const uid of liste){
      const d=DEMANDES[uid]; if(!d) continue;
      const role=(ROLESALL[uid]||{}).role;
      await R("demandes/"+uid).remove();
      if(d.type==="proie"&&role==="loup"&&ETAT.phase==="nuit"&&estVivant(uid)){
        await R("prive/cible").set(d.cible);
        await pousserVues();
        await R("actions/"+uid).set({j:jeton()});
      }
      else if(d.type==="fiole"&&role==="sorciere"&&ETAT.phase==="nuit"){
        const versee=!!d.oui;
        await R("prive/sauvee").set(versee);
        if(versee) await R("prive/potion").set(false);
        await R("roles/"+uid+"/vue/versee").set(versee);
        await R("actions/"+uid).set({j:jeton()});
      }
      else if(d.type==="sonde"&&role==="voyante"&&ETAT.phase==="nuit"){
        if(PRIVE.sondage!==false){
          await R("prive/sondage").set(false);
          await R("roles/"+uid+"/vue/sondage").set(false);
          await R("roles/"+uid+"/revelation").set({type:"joueur",nom:nomDe(d.cible),role:(ROLESALL[d.cible]||{}).role||"villageois"});
          await R("actions/"+uid).set({j:jeton()});
        }
      }
      else if(d.type==="tir"&&uid===ETAT.chasseurUid){
        const viv=Object.assign({},ETAT.vivants); viv[d.cible]=false;
        const rev=Object.assign({},ETAT.revele); rev[d.cible]=(ROLESALL[d.cible]||{}).role;
        await R("etat").update({phase:"tir",vivants:viv,revele:rev,tire:d.cible,chasseurUid:null});
      }
    }
  }catch(e){ signaler(e,"traiter une action de joueur"); }
  enTraitement=false;
  if(Object.keys(DEMANDES||{}).length) setTimeout(traiterDemandes,150);
}

async function pousserVues(){
  const cible=PRIVE.cible||null;
  for(const u of ordre()){
    const r=(ROLESALL[u]||{}).role;
    if(r==="loup") await R("roles/"+u+"/vue").update({cible:cible});
    if(r==="sorciere") await R("roles/"+u+"/vue").update({cible:cible,potion:PRIVE.potion!==false});
  }
}

async function nouvelleNuit(){
  for(const u of ordre()){ try{ await R("roles/"+u+"/revelation").remove(); }catch(e){} }
  await R("prive").update({cible:null,sauvee:false});
  for(const u of ordre()){
    const r=(ROLESALL[u]||{}).role;
    if(r==="loup"||r==="sorciere") await R("roles/"+u+"/vue").update({cible:null,potion:PRIVE.potion!==false,versee:null});
  }
  await viderNoeud("actions");
  await R("etat").update({phase:"nuit",nuit:(ETAT.nuit||1)+1,revote:false,exaequo:[],resultat:null});
}

function issue(viv){
  const L=ordre().filter(u=>viv[u]&&(ROLESALL[u]||{}).role==="loup").length;
  const V=ordre().filter(u=>viv[u]).length-L;
  if(L===0) return "village";
  if(L>=V) return "loup";
  if(L>=V-1) return "ultime";
  return null;
}
async function terminer(fin){
  const rev={}; ordre().forEach(u=>rev[u]=(ROLESALL[u]||{}).role);
  await R("etat").update({phase:"fin",fin:fin,revele:rev});
}
async function suite(viv,apresJour){
  const r=issue(viv);
  if(r==="village"||r==="loup") return terminer(r);
  if(apresJour) return R("etat").update({phase:"debat",revote:false,chronoFin:Date.now()+300000});
  if(r==="ultime") return R("etat").update({phase:"ultime"});
  return nouvelleNuit();
}

async function leverJour(){
  const cible=PRIVE.cible||null, sauvee=!!PRIVE.sauvee;
  const viv=Object.assign({},ETAT.vivants), rev=Object.assign({},ETAT.revele);
  if(cible&&!sauvee){ viv[cible]=false; rev[cible]=(ROLESALL[cible]||{}).role; }
  await R("etat").update({phase:"matin",vivants:viv,revele:rev,victime:cible,sauvee:sauvee});
}
async function apresMatin(){
  const v=ETAT.victime;
  if(!ETAT.sauvee&&v&&(ROLESALL[v]||{}).role==="chasseur")
    return R("etat").update({phase:"chasseur",chasseurUid:v,suite:"jour"});
  return suite(ETAT.vivants,true);
}
const apresTir=()=>suite(ETAT.vivants,ETAT.suite==="jour");
async function depouiller(){
  const c={};
  vivants().forEach(u=>{ const v=VOTES[u]; if(v&&v.t===tourVote()&&v.c) c[v.c]=(c[v.c]||0)+1; });
  const compte=Object.keys(c).map(u=>({uid:u,n:c[u]})).sort((a,b)=>b.n-a.n);
  if(!compte.length) return R("etat").update({phase:"resultat",resultat:{egalite:true,compte:[],definitif:true}});
  const max=compte[0].n, tetes=compte.filter(x=>x.n===max);
  if(tetes.length>1) return R("etat").update({phase:"resultat",exaequo:tetes.map(t=>t.uid),
    resultat:{egalite:true,compte:compte,definitif:!!ETAT.revote}});
  const elu=compte[0].uid;
  const viv=Object.assign({},ETAT.vivants); viv[elu]=false;
  const rev=Object.assign({},ETAT.revele); rev[elu]=(ROLESALL[elu]||{}).role;
  return R("etat").update({phase:"resultat",vivants:viv,revele:rev,resultat:{egalite:false,compte:compte,elu:elu}});
}
async function apresVote(){
  const r=ETAT.resultat||{};
  if(!r.egalite&&(ROLESALL[r.elu]||{}).role==="chasseur")
    return R("etat").update({phase:"chasseur",chasseurUid:r.elu,suite:"nuit"});
  return suite(ETAT.vivants,false);
}

async function recommencer(){
  try{
    await viderNoeud("actions"); await viderNoeud("votes"); await viderNoeud("demandes");
    try{ await R("roles").remove(); }catch(e){}
    try{ await R("prive").remove(); }catch(e){}
    await R("etat").set({phase:"salon",nuit:0,ordre:[],vivants:{},revele:{}});
  }catch(e){ signaler(e,"recommencer la partie"); }
}

/* ---------- actions joueur ---------- */
let marqueEnVol=null;
async function marquerAction(){
  if(!ETAT||aAgi(ME)||marqueEnVol===jeton()) return;
  marqueEnVol=jeton();
  try{ await R("actions/"+ME).set({j:jeton()}); }
  catch(e){ marqueEnVol=null; signaler(e,"enregistrer ton action"); }
}
async function demander(o){
  try{
    await R("demandes/"+ME).set(o);
    if(o.type!=="tir") await marquerAction();
  }catch(e){ signaler(e,"envoyer ton choix"); }
}

/* ---------- interactions ---------- */
function brancher(){
  const on=(s,f)=>{ const e=$(s); if(e) e.onclick=f; };
  $("#son").onclick=()=>{ VOIX=!VOIX; garder("lg_voix",VOIX?"1":"0"); if(!VOIX) taire(); derniereCle=null; rendre(); };
  on("#reessayer",()=>location.reload());
  on("#oublier",()=>{ garder("lg_mode",""); garder("lg_code",""); location.reload(); });

  on("#creer",async()=>{
    const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ"[Math.floor(Math.random()*24)]).join("");
    CODE=code; MODE="table"; garder("lg_code",code); garder("lg_mode","table");
    await db.ref("salons/"+code+"/meta").set({tableUid:ME,cree:Date.now()});
    await db.ref("salons/"+code+"/etat").set({phase:"salon",nuit:0,ordre:[],vivants:{},revele:{}});
    abonner(); rendre();
  });
  on("#rejoindre",async()=>{
    const v=($("#code-salon").value||"").trim().toUpperCase();
    if(v.length!==4){ $("#err").style.display="block"; return; }
    const s=await db.ref("salons/"+v+"/meta").once("value");
    if(!s.exists()){ $("#err").style.display="block"; return; }
    CODE=v; MODE="joueur"; garder("lg_code",v); garder("lg_mode","joueur");
    abonner(); rendre();
  });
  on("#s-asseoir",async()=>{
    const v=($("#mon-nom").value||"").trim();
    const pris=Object.keys(JOUEURS).some(u=>u!==ME&&nomDe(u).toLowerCase()===v.toLowerCase());
    if(!v||pris){ $("#err").style.display="block"; return; }
    try{ await R("joueurs/"+ME).set({nom:v,ts:Date.now()}); }
    catch(e){ ERREUR="Impossible de s'inscrire. Vérifie que les règles de sécurité sont bien enregistrées."; }
    rendre();
  });
  on("#quitter-siege",async()=>{ try{ await R("joueurs/"+ME).remove(); }catch(e){} rendre(); });
  on("#vider",async()=>{ await viderNoeud("joueurs"); rendre(); });
  on("#vers-compo",()=>{ brouillonCompo=defautCompo(Object.keys(JOUEURS).length); R("etat/phase").set("compo"); });
  on("#retour-salon",()=>R("etat/phase").set("salon"));
  document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{
    const r=b.dataset.plus,max=r==="loup"?3:1;
    if((brouillonCompo[r]||0)<max&&(brouillonCompo.villageois||0)>0){
      brouillonCompo[r]=(brouillonCompo[r]||0)+1;
      brouillonCompo.villageois--;
    }
    rendre(); });
  document.querySelectorAll("[data-moins]").forEach(b=>b.onclick=()=>{
    const r=b.dataset.moins,min=r==="loup"?1:0;
    if((brouillonCompo[r]||0)>min){
      brouillonCompo[r]=brouillonCompo[r]-1;
      brouillonCompo.villageois=(brouillonCompo.villageois||0)+1;
    }
    rendre(); });
  on("#distribuer",distribuerRoles);
  on("#vers-nuit",async()=>{ await viderNoeud("actions"); await R("etat/phase").set("nuit"); });
  on("#lever-jour",()=>leverJour().catch(e=>{ ERREUR="Impossible de lever le jour ("+(e&&e.code?e.code:e)+")."; rendre(); }));
  on("#apres-matin",apresMatin);
  on("#apres-tir",apresTir);
  on("#ouvrir-ultime",()=>R("etat").update({phase:"debat",revote:false,chronoFin:Date.now()+300000}));
  on("#aller-vote",async()=>{ await viderNoeud("votes"); await R("etat/phase").set("vote"); });
  on("#depouiller",depouiller);
  on("#forcer-nuit",async()=>{ await viderNoeud("actions"); await R("etat/phase").set("nuit"); });
  on("#forcer-jour",()=>leverJour().catch(e=>signaler(e,"lever le jour")));
  on("#forcer-chasseur",()=>R("etat").update({chasseurUid:null}).then(()=>suite(ETAT.vivants,ETAT.suite==="jour")).catch(e=>signaler(e,"passer le tir")));
  on("#forcer-urne",depouiller);
  on("#revoter",()=>R("etat").update({phase:"debat",revote:true,chronoFin:Date.now()+300000}));
  on("#apres-vote",apresVote);
  on("#abandon",()=>{ vuePanneau.abandon=true; rendre(); });
  on("#abandon-non",()=>{ vuePanneau.abandon=false; rendre(); });
  on("#abandon-ok",async()=>{ vuePanneau.abandon=false; await recommencer(); });
  on("#rejouer",async()=>{
    await recommencer();
  });

  on("#carte-vue",marquerAction);
  on("#fin-action",async()=>{ vuePanneau={revVue:true}; await marquerAction(); });
  on("#passer-nuit",marquerAction);
  on("#changer-proie",async()=>{ marqueEnVol=null; try{ await R("actions/"+ME).remove(); }catch(e){} rendre(); });
  on("#menu-sonde",()=>{ vuePanneau.sonde=true; rendre(); });
  on("#retour-voyante",()=>{ vuePanneau.sonde=false; rendre(); });
  document.querySelectorAll("[data-proie]").forEach(b=>b.onclick=()=>demander({type:"proie",cible:b.dataset.proie}));
  document.querySelectorAll("[data-fiole]").forEach(b=>b.onclick=()=>demander({type:"fiole",oui:b.dataset.fiole==="1"}));
  document.querySelectorAll("[data-sonde]").forEach(b=>b.onclick=()=>{ vuePanneau.sonde=false; demander({type:"sonde",cible:b.dataset.sonde}); });
  document.querySelectorAll("[data-tir]").forEach(b=>b.onclick=()=>demander({type:"tir",cible:b.dataset.tir}));
  document.querySelectorAll("[data-vote]").forEach(b=>b.onclick=async()=>{
    vuePanneau.vote=true;
    try{ await R("votes/"+ME).set({t:tourVote(),c:b.dataset.vote}); }catch(e){}
    rendre();
  });
}

/* ---------- abonnements ---------- */
function couper(){ abonnements.forEach(f=>{try{f();}catch(e){}}); abonnements=[]; }
function suivre(chemin,cb){
  const ref=R(chemin);
  const h=ref.on("value",s=>{ cb(s.val()); rendre(); },()=>{});
  abonnements.push(()=>ref.off("value",h));
}
function abonner(){
  couper();
  suivre("meta",v=>META=v);
  suivre("etat",v=>{ ETAT=v; if(ETAT&&!ETAT.vivants) ETAT.vivants={}; });
  suivre("joueurs",v=>JOUEURS=v||{});
  suivre("actions",v=>ACTIONS=v||{});
  if(estTable()){
    suivre("roles",v=>ROLESALL=v||{});
    suivre("prive",v=>PRIVE=v||{});
    suivre("votes",v=>VOTES=v||{});
    suivre("demandes",v=>{ DEMANDES=v||{}; traiterDemandes(); });
  } else {
    suivre("roles/"+ME,v=>MONROLE=v);
    suivre("votes/"+ME,v=>{ VOTES={}; if(v) VOTES[ME]=v; });
  }
}

/* ---------- démarrage ---------- */
firebase.initializeApp(firebaseConfig);
db=firebase.database();
firebase.auth().signInAnonymously().catch(e=>{
  ERREUR="Connexion anonyme refusée ("+e.code+"). Vérifie qu'elle est bien activée dans Firebase.";
  PRET=true; rendre();
});
firebase.auth().onAuthStateChanged(u=>{
  if(!u) return;
  ME=u.uid; PRET=true;
  if(MODE&&CODE) abonner();
  rendre();
});
let veille=null;
async function garderEveille(){
  try{ if(estTable()&&!veille&&navigator.wakeLock) veille=await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ veille=null; garderEveille(); } });
document.addEventListener("click",garderEveille);
rendre();
</script>
